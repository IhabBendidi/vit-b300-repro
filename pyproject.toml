[project]
name = "vit-b300-repro"
version = "0.1.0"
description = "ViT-B/16 GPU-only and local Zarr training reproduction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "zarr>=3.1,<4", "psutil>=6,<8", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
vit-gpu-only = "vit_benchmark.imaging:main"
vit-generate = "vit_benchmark.imaging_zarr:main"
vit-zarr = "vit_benchmark.zarr_training:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vit_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
